[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["ASPEC RACING PTY LTD"]
publish = false

[workspace.dependencies]
treedock-core = { path = "crates/treedock-core" }
treedock-win = { path = "crates/treedock-win" }
treedock-ntfs = { path = "crates/treedock-ntfs" }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
windows-sys = "0.61"
windows = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
